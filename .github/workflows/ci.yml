name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The suite is fully offline: chromadb, sentence-transformers/torch and the network
        # are stubbed (see tests/), so the heavy RAG runtime is NOT needed. This is the
        # minimal set the tests actually import at module load; if a new top-level import is
        # added and CI fails to import a module, extend this list to match.
        run: |
          pip install ruff
          pip install pydantic python-dotenv beautifulsoup4 requests feedparser \
            openai "mcp[cli]" gradio plotly scikit-learn

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v
