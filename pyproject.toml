[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-deal-hunter"
version = "0.1.0"
requires-python = ">=3.10"
# Upper bounds cap the next major version on the fast-moving / API-unstable libraries
# (chromadb, mcp, openai, pydantic, numpy, huggingface_hub, sentence-transformers, plotly,
# gradio) so a future ``pip install`` can't silently pull a breaking major and leave the app
# unbuildable. The cap only blocks the *next* major, never the currently-installed one. Mature,
# stable libraries (requests, bs4, feedparser, tqdm, pyarrow, scikit-learn) are left uncapped.
# For a byte-for-byte reproducible deploy, generate a lockfile in the target environment --
# see "Reproducible installs" in the README.
dependencies = [
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.1.0,<2",
    "feedparser>=6.0.12",
    "gradio>=5.0,<6.0",
    "huggingface_hub>=0.20.0,<1",
    "mcp[cli]>=1.2.0,<2",
    "numpy>=2.0.0,<3",
    "openai>=1.50.0,<2",
    "plotly>=6.0.0,<7",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0,<6",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.0",
    "ruff>=0.6.0",
]

# Single top-level namespace. Installing the project (``pip install -e .``) puts
# ``auto_deal_hunter`` on the import path so modules and the spawned MCP server resolve
# without per-file ``sys.path`` manipulation.
[tool.hatch.build.targets.wheel]
packages = ["auto_deal_hunter"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
